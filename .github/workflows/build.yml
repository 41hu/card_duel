name: Build and Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read_version
        run: echo "version=$(grep -oP 'VERSION = \"\K[^\"]+' scripts/version.gd)" >> "$GITHUB_OUTPUT"

  export-windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Download Windows Export Template
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q -o Godot_v4.7.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.1.stable/
          mv ~/.local/share/godot/export_templates/4.7.1.stable/templates/* ~/.local/share/godot/export_templates/4.7.1.stable/ 2>/dev/null || true

      - name: Export Windows .exe
        run: |
          mkdir -p dist
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" "dist/Card Duel.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardDuel-Windows
          path: dist/
          retention-days: 30

  export-android:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Download Android Export Template
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q -o Godot_v4.7.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.1.stable/
          mv ~/.local/share/godot/export_templates/4.7.1.stable/templates/* ~/.local/share/godot/export_templates/4.7.1.stable/ 2>/dev/null || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          # 校验：secret 缺失/为空时直接失败，避免 Godot 自动生成新 keystore 导致签名漂移
          test -s ~/.android/debug.keystore || { echo "ERROR: DEBUG_KEYSTORE secret 未配置或为空，构建中止"; exit 1; }

      - name: Set Android App Version from version.gd
        run: |
          VERSION=$(grep -oP 'VERSION = "\K[^"]+' scripts/version.gd)
          CODE=$(echo $VERSION | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/version\/code=.*/version\/code=$CODE/" export_presets.cfg
          sed -i "s/version\/name=\"\"/version\/name=\"$VERSION\"/" export_presets.cfg
          echo "Set Android version to $VERSION (code $CODE)"

      - name: Export Android APK (Debug)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          # 显式指定 debug keystore（否则 Godot 可能用默认路径/自动生成导致签名漂移）
          # USER 字段是 keystore 别名（androiddebugkey），不是用户名
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p dist
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-debug "Android" "dist/CardDuel.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardDuel-Android
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: dist/CardDuel.apk
          generate_release_notes: false

      - name: Deploy APK and Version File to Server
        run: |
          echo "{\"version\":\"${{ needs.version.outputs.version }}\"}" > version.json
          mkdir -p deploy_dir
          cp dist/CardDuel.apk deploy_dir/
          cp version.json deploy_dir/
          ls deploy_dir/

      - name: SCP to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 47.107.47.251
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy_dir/*
          target: ~/card_duel_dist/
          strip_components: 1
